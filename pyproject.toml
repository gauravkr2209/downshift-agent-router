[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "downshift"
version = "0.1.0"
description = "Evidence-based model tier router for AI agents on Nemotron and Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gaurav Kumar" }
]
license = { text = "MIT" }
dependencies = [
    "sqlmodel>=0.0.16",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "openai>=1.30.0",
    "tavily-python>=0.3.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk*", "server*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
